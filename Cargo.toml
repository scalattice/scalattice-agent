[package]
name = "scalattice-agent"
version = "1.0.51"
edition = "2021"
description = "Open-source GPU machine agent for the Scalattice inference network"
license = "MIT"
repository = "https://github.com/Robottik-Software/scalattice-agent"
readme = "README.md"
keywords = ["scalattice", "gpu", "inference", "websocket"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "scalattice-agent"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }
llama-cpp-2 = { version = "0.1.150", default-features = false, features = ["openmp", "sampler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
image = "0.25"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["gpu"]
# x86_64 Linux: NVIDIA CUDA + AMD/Intel Vulkan; release bundles non-driver .so deps
gpu = ["cuda", "vulkan"]
# Windows release: CUDA only (vulkan-shaders-gen is unreliable in MSVC/CI)
win-gpu = ["cuda"]
# aarch64 native: NVIDIA CUDA + Vulkan (Jetson, Graviton, Mali, Adreno)
arm-gpu = ["cuda", "vulkan"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
dynamic-backends = ["llama-cpp-2/dynamic-backends"]
rocm = ["llama-cpp-2/rocm"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
