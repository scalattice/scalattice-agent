[package]
name = "scalattice-agent"
version = "1.0.0"
edition = "2021"
description = "Open-source GPU operator agent for the Scalattice inference network"
license = "MIT"
repository = "https://github.com/robottik-software/scalattice-client"
readme = "README.md"
keywords = ["scalattice", "gpu", "inference", "websocket"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "scalattice-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
