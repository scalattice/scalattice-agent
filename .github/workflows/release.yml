name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64: NVIDIA CUDA (GTX/RTX, multi-GPU) + Vulkan (AMD/Intel) via dynamic backends
          - id: x86_64-gpu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: gpu
            no_default_features: false
            cuda: true

          # aarch64: native ARM runner — CUDA (Jetson / ARM NVIDIA) + Vulkan (Mali, Adreno, etc.)
          # Built natively to avoid cross-compile CMake conflicts in llama.cpp.
          - id: aarch64-gpu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: arm-gpu
            no_default_features: true
            cuda: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            cmake \
            build-essential \
            pkg-config \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Install CUDA toolkit
        id: cuda
        if: matrix.cuda
        continue-on-error: ${{ matrix.id == 'aarch64-gpu' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.6.0'
          method: network
          use-github-cache: false

      - name: Require CUDA (x86_64)
        if: matrix.id == 'x86_64-gpu' && steps.cuda.outcome != 'success'
        run: |
          echo "CUDA toolkit install failed — x86_64 GPU build cannot continue."
          exit 1

      - name: Build release binary
        env:
          CMAKE_PREFIX_PATH: /usr
        run: |
          set -euo pipefail
          features="${{ matrix.features }}"
          if [ "${{ matrix.id }}" = "aarch64-gpu" ] && [ "${{ steps.cuda.outcome }}" != "success" ]; then
            echo "CUDA unavailable on ARM runner — building with Vulkan GPU backend (Jetson: use NVIDIA driver + rebuild with CUDA locally if needed)"
            features="vulkan"
          fi
          args=(build --release --target "${{ matrix.target }}")
          if [ "${{ matrix.no_default_features }}" = "true" ]; then
            args+=(--no-default-features)
          fi
          args+=(--features "$features")
          echo "cargo ${args[*]}"
          cargo "${args[@]}"

      - name: Package tarball
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/scalattice-agent" dist/
          tar -czf "dist/scalattice-agent-${{ matrix.target }}.tar.gz" -C dist scalattice-agent

      - uses: actions/upload-artifact@v4
        with:
          name: scalattice-agent-${{ matrix.target }}
          path: dist/scalattice-agent-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
