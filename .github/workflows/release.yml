name: Release

# Linux x86_64: built locally by scripts/release.sh
# Windows: self-hosted runner (label scalattice-release). See scripts/install-windows-runner.ps1
# aarch64: GitHub-hosted ARM runner (full release only)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. v1.0.2)'
        required: true
        type: string
      targets:
        description: 'Build targets'
        required: true
        type: choice
        default: full
        options:
          - aarch64-only
          - windows-only
          - full
      windows_runner:
        description: 'Windows build host'
        required: true
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - github-hosted

permissions:
  contents: write

jobs:
  build-aarch64:
    if: inputs.targets == 'aarch64-only' || inputs.targets == 'full'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install build deps (Vulkan)
        run: |
          set -euo pipefail
          apt_retry() {
            local n=0 max=5 delay=20
            until sudo "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "apt command failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "==> apt failed (attempt ${n}/${max}), retrying in ${delay}s: $*"
              sudo rm -rf /var/lib/apt/lists/*
              sleep "$delay"
              delay=$((delay + 15))
            done
          }
          apt_retry apt-get update
          apt_retry apt-get install -y clang libclang-dev cmake build-essential pkg-config wget glslc \
            libvulkan-dev spirv-headers libshaderc-dev spirv-tools libvulkan1 patchelf mesa-vulkan-drivers
      - name: Install CUDA
        id: cuda
        uses: mjun0812/setup-cuda@v1
        with:
          version: '12.6'
          method: auto
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-gpu
          cache-targets: true
          cache-workspace-crates: true
      - name: Build + package
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.cuda-path }}
          CMAKE_PREFIX_PATH: /usr
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          export PATH="${CUDA_PATH}/bin:$PATH"
          nvcc --version
          cargo build --release --target aarch64-unknown-linux-gnu --no-default-features --features arm-gpu
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/scalattice-agent dist/
          chmod +x scripts/bundle-release-libs.sh
          scripts/bundle-release-libs.sh dist/scalattice-agent dist target/aarch64-unknown-linux-gnu/release
          if [ -d dist/lib ]; then
            tar -czf dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz -C dist scalattice-agent lib
          else
            tar -czf dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz -C dist scalattice-agent
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64
          path: dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz

  build-windows-self-hosted:
    if: |
      (inputs.targets == 'windows-only' || inputs.targets == 'full') &&
      inputs.windows_runner == 'self-hosted'
    runs-on: [self-hosted, Windows, X64, scalattice-release]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Sync Cargo.toml to release tag
        shell: cmd
        env:
          SCALATTICE_VERSION: ${{ inputs.tag }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sync-cargo-version.ps1
      - name: Prepare build environment
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\prepare-windows-ci.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-self-hosted-v5-${{ inputs.tag }}
          cache-targets: true
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build + package
        shell: cmd
        env:
          CARGO_INCREMENTAL: "0"
          SCALATTICE_VERSION: ${{ inputs.tag }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/scalattice-agent-x86_64-pc-windows-msvc.zip
            dist/ScalatticeAgentSetup-x86_64.exe

  build-windows-github-hosted:
    if: |
      (inputs.targets == 'windows-only' || inputs.targets == 'full') &&
      inputs.windows_runner == 'github-hosted'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Sync Cargo.toml to release tag
        shell: cmd
        env:
          SCALATTICE_VERSION: ${{ inputs.tag }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sync-cargo-version.ps1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Jimver/cuda-toolkit@v0.2.29
        id: cuda
        with:
          cuda: '12.6.3'
          method: 'network'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-gpu-v5-${{ inputs.tag }}
          cache-targets: true
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build + package
        shell: cmd
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.cuda_path }}
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "4"
          SCALATTICE_VERSION: ${{ inputs.tag }}
        run: |
          set "PATH=%CUDA_PATH%\bin;%PATH%"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/scalattice-agent-x86_64-pc-windows-msvc.zip
            dist/ScalatticeAgentSetup-x86_64.exe

  upload:
    needs: [build-aarch64, build-windows-self-hosted, build-windows-github-hosted]
    if: |
      always() && !cancelled() &&
      (
        (inputs.targets == 'windows-only' &&
          (needs.build-windows-self-hosted.result == 'success' ||
           needs.build-windows-github-hosted.result == 'success')) ||
        (inputs.targets == 'aarch64-only' &&
          needs.build-aarch64.result == 'success') ||
        (inputs.targets == 'full' &&
          needs.build-aarch64.result == 'success' &&
          (needs.build-windows-self-hosted.result == 'success' ||
           needs.build-windows-github-hosted.result == 'success'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GH_REPO" >/dev/null || {
            echo "Release ${TAG} not found on ${GH_REPO}." >&2
            exit 1
          }
          mapfile -t files < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \))
          [[ ${#files[@]} -gt 0 ]] || { echo "No release archives built." >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "Uploading $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber -R "$GH_REPO"
          done
