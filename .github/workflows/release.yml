name: Release

# Called automatically by scripts/release.sh for aarch64.
# Can also be run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. v1.0.2)'
        required: true
        type: string
      targets:
        description: 'Build targets'
        required: true
        type: choice
        default: aarch64-only
        options:
          - aarch64-only
          - both

permissions:
  contents: write

jobs:
  build-x86_64:
    if: inputs.targets == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install build deps + CUDA
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake build-essential pkg-config wget glslc \
            libvulkan-dev spirv-headers libshaderc-dev spirv-tools libvulkan1 patchelf mesa-vulkan-drivers
          keyring="cuda-keyring_1.1-1_all.deb"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/${keyring}"
          sudo dpkg -i "${keyring}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-nvrtc-dev-12-6 \
            cuda-cccl-12-6 libcublas-dev-12-6 libcurand-dev-12-6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-gpu
          cache-targets: true
          cache-workspace-crates: true
      - name: Build + package
        env:
          CUDA_PATH: /usr/local/cuda-12.6
          CMAKE_PREFIX_PATH: /usr
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          export PATH="/usr/local/cuda-12.6/bin:$PATH"
          cargo build --release --target x86_64-unknown-linux-gnu --features gpu
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/scalattice-agent dist/
          chmod +x scripts/bundle-release-libs.sh
          scripts/bundle-release-libs.sh dist/scalattice-agent dist target/x86_64-unknown-linux-gnu/release
          if [ -d dist/lib ]; then
            tar -czf dist/scalattice-agent-x86_64-unknown-linux-gnu.tar.gz -C dist scalattice-agent lib
          else
            tar -czf dist/scalattice-agent-x86_64-unknown-linux-gnu.tar.gz -C dist scalattice-agent
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64
          path: dist/scalattice-agent-x86_64-unknown-linux-gnu.tar.gz

  build-aarch64:
    if: inputs.targets == 'aarch64-only' || inputs.targets == 'both'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install build deps + CUDA
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake build-essential pkg-config wget glslc \
            libvulkan-dev spirv-headers libshaderc-dev spirv-tools libvulkan1 patchelf mesa-vulkan-drivers
          keyring="cuda-keyring_1.1-1_all.deb"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/${keyring}"
          sudo dpkg -i "${keyring}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-nvrtc-dev-12-6 \
            cuda-cccl-12-6 libcublas-dev-12-6 libcurand-dev-12-6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-gpu
          cache-targets: true
          cache-workspace-crates: true
      - name: Build + package
        env:
          CUDA_PATH: /usr/local/cuda-12.6
          CMAKE_PREFIX_PATH: /usr
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          export PATH="/usr/local/cuda-12.6/bin:$PATH"
          cargo build --release --target aarch64-unknown-linux-gnu --no-default-features --features arm-gpu
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/scalattice-agent dist/
          chmod +x scripts/bundle-release-libs.sh
          scripts/bundle-release-libs.sh dist/scalattice-agent dist target/aarch64-unknown-linux-gnu/release
          if [ -d dist/lib ]; then
            tar -czf dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz -C dist scalattice-agent lib
          else
            tar -czf dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz -C dist scalattice-agent
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64
          path: dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz

  upload:
    needs: [build-x86_64, build-aarch64]
    if: |
      always() && !cancelled() &&
      (needs.build-aarch64.result == 'success' || needs.build-x86_64.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null || {
            echo "Release ${TAG} not found." >&2
            exit 1
          }
          shopt -s nullglob
          files=(artifacts/**/*.tar.gz)
          [[ ${#files[@]} -gt 0 ]] || { echo "No tarballs built." >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "Uploading $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done
