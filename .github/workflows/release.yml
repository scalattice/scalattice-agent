name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NVIDIA (CUDA) + AMD/Intel (Vulkan) + runtime backend loading
          - id: x86_64-gpu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: gpu
            no_default_features: false
            cuda_repo: ubuntu2404/x86_64

          # Native ARM: NVIDIA SBSA CUDA + Vulkan (Jetson, Graviton, Mali, Adreno)
          - id: aarch64-gpu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: arm-gpu
            no_default_features: true
            cuda_repo: ubuntu2404/sbsa

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build + Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            cmake \
            build-essential \
            pkg-config \
            wget \
            glslc \
            libvulkan-dev \
            spirv-headers \
            libshaderc-dev \
            spirv-tools \
            mesa-vulkan-drivers
          echo "=== GPU build tools ==="
          glslc --version
          pkg-config --modversion vulkan || true

      - name: Install CUDA toolkit (dev only, no driver)
        run: |
          set -euo pipefail
          keyring="cuda-keyring_1.1-1_all.deb"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repo }}/${keyring}"
          sudo dpkg -i "${keyring}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 \
            cuda-cudart-dev-12-6 \
            cuda-nvrtc-dev-12-6 \
            cuda-cccl-12-6 \
            libcublas-dev-12-6 \
            libcurand-dev-12-6
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-12.6/bin:${PATH}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          /usr/local/cuda-12.6/bin/nvcc --version

      - name: Build release binary
        env:
          CMAKE_PREFIX_PATH: /usr
          CUDA_PATH: /usr/local/cuda-12.6
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
        run: |
          set -euo pipefail
          args=(build --release --target "${{ matrix.target }}")
          if [ "${{ matrix.no_default_features }}" = "true" ]; then
            args+=(--no-default-features)
          fi
          args+=(--features "${{ matrix.features }}")
          echo "cargo ${args[*]}"
          cargo "${args[@]}"

      - name: Package tarball
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          RELEASE="target/${TARGET}/release"
          mkdir -p dist/lib
          cp "${RELEASE}/scalattice-agent" dist/
          # If any llama.cpp objects were built as .so, bundle them for install.sh.
          find "${RELEASE}/build" -type f \( -name 'libggml*.so*' -o -name 'libllama*.so*' \) 2>/dev/null \
            | while read -r lib; do
                cp -L "$lib" "dist/lib/$(basename "$lib")"
              done || true
          if [ -z "$(ls -A dist/lib 2>/dev/null)" ]; then
            rmdir dist/lib
            tar -czf "dist/scalattice-agent-${TARGET}.tar.gz" -C dist scalattice-agent
          else
            tar -czf "dist/scalattice-agent-${TARGET}.tar.gz" -C dist scalattice-agent lib
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: scalattice-agent-${{ matrix.target }}
          path: dist/scalattice-agent-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
