name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ci_build:
        description: 'Compile release binaries in CI (~1h). Leave off when using scripts/release.sh'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Tag pushes from scripts/release.sh always upload assets first — never compile here.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify maintainer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Verifying release ${TAG} (no CI compile on tag push)."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub release found for ${TAG}." >&2
            exit 1
          fi

          ASSET_COUNT="$(gh release view "$TAG" --json assets -q '.assets | length')"
          if [[ "${ASSET_COUNT:-0}" -lt 1 ]]; then
            echo "Release ${TAG} has no uploaded assets." >&2
            echo "Publish with: ./scripts/release.sh" >&2
            exit 1
          fi

          echo "Release ${TAG} has ${ASSET_COUNT} asset(s) — OK."

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.ci_build == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x86_64-gpu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: gpu
            no_default_features: false
            cuda_repo: ubuntu2404/x86_64
          - id: aarch64-gpu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: arm-gpu
            no_default_features: true
            cuda_repo: ubuntu2404/sbsa

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build + Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev cmake build-essential pkg-config wget glslc \
            libvulkan-dev spirv-headers libshaderc-dev spirv-tools libvulkan1 \
            patchelf mesa-vulkan-drivers

      - name: Install CUDA toolkit (dev only, no driver)
        run: |
          set -euo pipefail
          keyring="cuda-keyring_1.1-1_all.deb"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repo }}/${keyring}"
          sudo dpkg -i "${keyring}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-nvrtc-dev-12-6 \
            cuda-cccl-12-6 libcublas-dev-12-6 libcurand-dev-12-6
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-12.6/bin:${PATH}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.id }}
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Build release binary
        env:
          CMAKE_PREFIX_PATH: /usr
          CUDA_PATH: /usr/local/cuda-12.6
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          args=(build --release --target "${{ matrix.target }}")
          if [ "${{ matrix.no_default_features }}" = "true" ]; then
            args+=(--no-default-features)
          fi
          args+=(--features "${{ matrix.features }}")
          cargo "${args[@]}"

      - name: Package tarball
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          RELEASE="target/${TARGET}/release"
          BIN="${RELEASE}/scalattice-agent"
          mkdir -p dist
          cp "$BIN" dist/scalattice-agent
          chmod +x scripts/bundle-release-libs.sh
          scripts/bundle-release-libs.sh dist/scalattice-agent dist "${RELEASE}"
          if [ -d dist/lib ]; then
            tar -czf "dist/scalattice-agent-${TARGET}.tar.gz" -C dist scalattice-agent lib
          else
            tar -czf "dist/scalattice-agent-${TARGET}.tar.gz" -C dist scalattice-agent
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: scalattice-agent-${{ matrix.target }}
          path: dist/scalattice-agent-${{ matrix.target }}.tar.gz

  release-ci:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.ci_build == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
