name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      local: ${{ steps.detect.outputs.local }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect local (prebuilt) release
        id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SUBJECT="$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null || true)"
          BODY="$(git tag -l --format='%(contents:body)' "$TAG" 2>/dev/null || true)"
          if [[ "${SUBJECT}${BODY}" == *"[local]"* ]]; then
            echo "local=true" >> "$GITHUB_OUTPUT"
            echo "Local release tag — skipping CI compile."
          else
            echo "local=false" >> "$GITHUB_OUTPUT"
            echo "CI will compile release binaries."
          fi

  build:
    needs: meta
    if: needs.meta.outputs.local != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # NVIDIA CUDA + AMD/Intel Vulkan; installer ships bundled runtime libs
          - id: x86_64-gpu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: gpu
            no_default_features: false
            cuda_repo: ubuntu2404/x86_64

          # Native ARM: NVIDIA SBSA CUDA + Vulkan (Jetson, Graviton, Mali, Adreno)
          - id: aarch64-gpu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: arm-gpu
            no_default_features: true
            cuda_repo: ubuntu2404/sbsa

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build + Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            cmake \
            build-essential \
            pkg-config \
            wget \
            glslc \
            libvulkan-dev \
            spirv-headers \
            libshaderc-dev \
            spirv-tools \
            libvulkan1 \
            patchelf \
            mesa-vulkan-drivers
          echo "=== GPU build tools ==="
          glslc --version
          pkg-config --modversion vulkan || true

      - name: Install CUDA toolkit (dev only, no driver)
        run: |
          set -euo pipefail
          keyring="cuda-keyring_1.1-1_all.deb"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repo }}/${keyring}"
          sudo dpkg -i "${keyring}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 \
            cuda-cudart-dev-12-6 \
            cuda-nvrtc-dev-12-6 \
            cuda-cccl-12-6 \
            libcublas-dev-12-6 \
            libcurand-dev-12-6
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-12.6/bin:${PATH}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          /usr/local/cuda-12.6/bin/nvcc --version

      # First tagged release per target: ~50 min (llama.cpp + CUDA/Vulkan compile).
      # Commit Cargo.lock and reuse tags with [local] for maintainer-built binaries instead.
      # Later CI tags with unchanged deps: usually a few minutes (relink + changed crates only).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.id }}
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true
          env-vars: |
            CUDA_PATH
            CMAKE_PREFIX_PATH
            Vulkan_GLSLC_EXECUTABLE
            CC
            CXX
            CFLAGS
            CMAKE
            RUST
            CARGO

      - name: Build release binary
        env:
          CMAKE_PREFIX_PATH: /usr
          CUDA_PATH: /usr/local/cuda-12.6
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          args=(build --release --target "${{ matrix.target }}")
          if [ "${{ matrix.no_default_features }}" = "true" ]; then
            args+=(--no-default-features)
          fi
          args+=(--features "${{ matrix.features }}")
          echo "cargo ${args[*]}"
          cargo "${args[@]}"

      - name: Package tarball
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          RELEASE="target/${TARGET}/release"
          BIN="${RELEASE}/scalattice-agent"
          mkdir -p dist
          cp "$BIN" dist/scalattice-agent
          chmod +x scripts/bundle-release-libs.sh
          scripts/bundle-release-libs.sh dist/scalattice-agent dist "${RELEASE}"
          if [ -d dist/lib ]; then
            tar -czf "dist/scalattice-agent-${TARGET}.tar.gz" -C dist scalattice-agent lib
          else
            tar -czf "dist/scalattice-agent-${TARGET}.tar.gz" -C dist scalattice-agent
          fi
          echo "=== bundled libraries ==="
          tar -tzf "dist/scalattice-agent-${TARGET}.tar.gz"
          echo "=== dynamic deps (should be glibc + libcuda only) ==="
          ldd dist/scalattice-agent || true

      - uses: actions/upload-artifact@v4
        with:
          name: scalattice-agent-${{ matrix.target }}
          path: dist/scalattice-agent-${{ matrix.target }}.tar.gz

  release:
    needs: [meta, build]
    if: always() && !cancelled() && (needs.meta.outputs.local == 'true' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Local release already published
        if: needs.meta.outputs.local == 'true'
        run: |
          echo "Prebuilt tarballs were uploaded by scripts/publish-release.sh — nothing to compile."

      - uses: actions/download-artifact@v4
        if: needs.meta.outputs.local != 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        if: needs.meta.outputs.local != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
