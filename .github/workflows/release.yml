name: Release

# production: a merge (or push) onto this branch tags a release and builds every platform.
# Linux x86_64 CUDA is built here (no local build host required).
# Windows ALWAYS defaults to the self-hosted scalattice-release runner on production pushes.
# workflow_dispatch may override to github-hosted only as an explicit fallback.
# macOS is GitHub-hosted macos-14 (Apple Silicon). Unsigned if Apple secrets are missing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.33). Leave empty to bump from Cargo.toml'
        required: false
        type: string
      targets:
        description: 'Build targets'
        required: true
        type: choice
        default: full
        options:
          - aarch64-only
          - windows-only
          - macos-only
          - full
      windows_runner:
        description: 'Windows build host'
        required: true
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
  # One event per merge: a GitHub PR into production always produces this push.
  push:
    branches: [production]

concurrency:
  group: release-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: |
      github.repository == 'scalattice/scalattice-agent' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (
        github.event_name != 'push' ||
        (
          !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !contains(github.event.head_commit.message, '[skip release]')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      targets: ${{ steps.meta.outputs.targets }}
      windows_runner: ${{ steps.meta.outputs.windows_runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production
      - name: Prepare tag and GitHub release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/ci-prepare-release.sh
          scripts/ci-prepare-release.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "targets=${{ github.event.inputs.targets }}" >> "$GITHUB_OUTPUT"
            echo "windows_runner=${{ github.event.inputs.windows_runner }}" >> "$GITHUB_OUTPUT"
          else
            echo "targets=full" >> "$GITHUB_OUTPUT"
            echo "windows_runner=self-hosted" >> "$GITHUB_OUTPUT"
          fi

  build-linux-x86_64:
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.targets == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install build deps (Vulkan)
        run: |
          set -euo pipefail
          apt_retry() {
            local n=0 max=5 delay=20
            until sudo "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "apt command failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "==> apt failed (attempt ${n}/${max}), retrying in ${delay}s: $*"
              sudo rm -rf /var/lib/apt/lists/*
              sleep "$delay"
              delay=$((delay + 15))
            done
          }
          apt_retry apt-get update
          apt_retry apt-get install -y clang libclang-dev cmake build-essential pkg-config wget glslc \
            libvulkan-dev spirv-headers libshaderc-dev spirv-tools libvulkan1 patchelf mesa-vulkan-drivers
      - name: Install CUDA
        id: cuda
        uses: mjun0812/setup-cuda@v1
        with:
          version: '12.6'
          method: auto
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-gpu
          cache-targets: true
          cache-workspace-crates: true
      - name: Build + package
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.cuda-path }}
          CMAKE_PREFIX_PATH: /usr
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          export PATH="${CUDA_PATH}/bin:$PATH"
          chmod +x scripts/build-release.sh scripts/bundle-release-libs.sh scripts/prune-cargo-target.sh
          ./scripts/build-release.sh x86_64-unknown-linux-gnu
      - name: Vet auto-update and remote restart
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.cuda-path }}
        run: |
          set -euo pipefail
          python3 scripts/ci-update-smoke.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/scalattice-agent-x86_64-unknown-linux-gnu.tar.gz

  build-aarch64:
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.targets == 'aarch64-only' || needs.prepare.outputs.targets == 'full')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install build deps (Vulkan)
        run: |
          set -euo pipefail
          apt_retry() {
            local n=0 max=5 delay=20
            until sudo "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "apt command failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "==> apt failed (attempt ${n}/${max}), retrying in ${delay}s: $*"
              sudo rm -rf /var/lib/apt/lists/*
              sleep "$delay"
              delay=$((delay + 15))
            done
          }
          apt_retry apt-get update
          apt_retry apt-get install -y clang libclang-dev cmake build-essential pkg-config wget glslc \
            libvulkan-dev spirv-headers libshaderc-dev spirv-tools libvulkan1 patchelf mesa-vulkan-drivers
      - name: Install CUDA
        id: cuda
        uses: mjun0812/setup-cuda@v1
        with:
          version: '12.6'
          method: auto
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-gpu
          cache-targets: true
          cache-workspace-crates: true
      - name: Build + package
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.cuda-path }}
          CMAKE_PREFIX_PATH: /usr
          Vulkan_GLSLC_EXECUTABLE: /usr/bin/glslc
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          export PATH="${CUDA_PATH}/bin:$PATH"
          nvcc --version
          cargo build --release --target aarch64-unknown-linux-gnu --no-default-features --features arm-gpu
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/scalattice-agent dist/
          chmod +x scripts/bundle-release-libs.sh
          scripts/bundle-release-libs.sh dist/scalattice-agent dist target/aarch64-unknown-linux-gnu/release
          if [ -d dist/lib ]; then
            tar -czf dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz -C dist scalattice-agent lib
          else
            tar -czf dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz -C dist scalattice-agent
          fi
      - name: Vet auto-update and remote restart
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.cuda-path }}
        run: |
          set -euo pipefail
          python3 scripts/ci-update-smoke.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64
          path: dist/scalattice-agent-aarch64-unknown-linux-gnu.tar.gz

  build-macos:
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.targets == 'macos-only' || needs.prepare.outputs.targets == 'full')
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Require Apple Silicon
        run: |
          set -euo pipefail
          echo "uname=$(uname -sm)"
          test "$(uname -m)" = "arm64"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-metal
          cache-targets: true
          cache-workspace-crates: true
      - name: Build Metal (arm64 only)
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin --no-default-features --features metal
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/scalattice-agent dist/scalattice-agent
          file dist/scalattice-agent
          lipo -archs dist/scalattice-agent | grep -qx arm64
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh
      - name: Sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          chmod +x scripts/sign-macos.sh scripts/package-macos.sh
          if [ -z "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Apple signing secrets not set; uploading unsigned arm64 app/dmg."
            echo "See docs/macos-signing.md"
            exit 0
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          KEYCHAIN="${RUNNER_TEMP}/scalattice-signing.keychain-db"
          P12="${RUNNER_TEMP}/developer-id.p12"
          G2="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          echo "${APPLE_DEVELOPER_ID_P12_BASE64}" | tr -d '\n\r ' | base64 -d > "$P12"
          echo "PKCS12 size: $(wc -c < "$P12") bytes"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Keep login/System in the search list. Replacing it with only the temp
          # keychain makes Developer ID identities invalid (missing Apple G2 CA).
          EXISTING_KEYCHAINS="$(security list-keychain -d user | sed -E 's/^[[:space:]]*"//;s/"[[:space:]]*$//' | tr '\n' ' ')"
          # shellcheck disable=SC2086
          security list-keychain -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN"
          # Cert is issued by Developer ID Certification Authority G2.
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$G2"
          security import "$G2" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security || true
          # OpenSSL 3 default .p12 (SHA-256 MAC) fails here with "wrong password?".
          # Re-export with `openssl pkcs12 -export -legacy` — see docs/macos-signing.md.
          security import "$P12" -k "$KEYCHAIN" -P "${APPLE_P12_PASSWORD:-}" -A -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "==> codesigning identities:"
          security find-identity -v -p codesigning
          export APPLE_KEYCHAIN="$KEYCHAIN"
          ./scripts/sign-macos.sh "dist/Scalattice Agent.app"
          ./scripts/package-macos.sh --dmg-from-app
          ./scripts/sign-macos.sh "dist/Scalattice Agent.app" dist/ScalatticeAgentSetup-aarch64.dmg
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$P12" "$G2"
      - name: Package
        run: |
          set -euo pipefail
          test -f dist/ScalatticeAgentSetup-aarch64.dmg
          test -f dist/scalattice-agent-aarch64-apple-darwin.tar.gz
      - name: Vet auto-update and remote restart
        run: |
          set -euo pipefail
          python3 scripts/ci-update-smoke.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ScalatticeAgentSetup-aarch64.dmg
            dist/scalattice-agent-aarch64-apple-darwin.tar.gz

  build-windows-self-hosted:
    needs: prepare
    if: |
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.targets == 'windows-only' || needs.prepare.outputs.targets == 'full') &&
      needs.prepare.outputs.windows_runner == 'self-hosted'
    runs-on: [self-hosted, Windows, X64, scalattice-release]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Prepare build environment
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\prepare-windows-ci.ps1
      - name: Sync Cargo.toml to release tag
        shell: cmd
        env:
          SCALATTICE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sync-cargo-version.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-self-hosted-v5-${{ needs.prepare.outputs.tag }}
          cache-targets: true
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ensure Artifact Signing Client Tools
        shell: powershell
        run: .\scripts\ensure-artifact-signing-tools.ps1
      - name: Build + package
        shell: cmd
        env:
          CARGO_INCREMENTAL: "0"
          SCALATTICE_VERSION: ${{ needs.prepare.outputs.tag }}
          AZURE_TENANT_ID: 5d902829-56a2-41e5-812d-a3ec3a502f3d
          AZURE_CLIENT_ID: 0c6c6d06-09c9-4da3-a72c-516eecde1b5e
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1
      - name: Vet auto-update and remote restart
        shell: powershell
        run: .\scripts\run-ci-update-smoke.ps1 -Dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/scalattice-agent-x86_64-pc-windows-msvc.zip
            dist/ScalatticeAgentSetup-x86_64.exe

  build-windows-github-hosted:
    needs: prepare
    if: |
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.targets == 'windows-only' || needs.prepare.outputs.targets == 'full') &&
      needs.prepare.outputs.windows_runner == 'github-hosted'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync Cargo.toml to release tag
        shell: cmd
        env:
          SCALATTICE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sync-cargo-version.ps1
      - uses: Jimver/cuda-toolkit@v0.2.29
        id: cuda
        with:
          cuda: '12.6.3'
          method: 'network'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-gpu-v5-${{ needs.prepare.outputs.tag }}
          cache-targets: true
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ensure Artifact Signing Client Tools
        shell: powershell
        run: .\scripts\ensure-artifact-signing-tools.ps1
      - name: Build + package
        shell: cmd
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.cuda_path }}
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "4"
          SCALATTICE_VERSION: ${{ needs.prepare.outputs.tag }}
          AZURE_TENANT_ID: 5d902829-56a2-41e5-812d-a3ec3a502f3d
          AZURE_CLIENT_ID: 0c6c6d06-09c9-4da3-a72c-516eecde1b5e
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set "PATH=%CUDA_PATH%\bin;%PATH%"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1
      - name: Vet auto-update and remote restart
        shell: powershell
        run: .\scripts\run-ci-update-smoke.ps1 -Dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/scalattice-agent-x86_64-pc-windows-msvc.zip
            dist/ScalatticeAgentSetup-x86_64.exe

  upload:
    needs:
      - prepare
      - build-linux-x86_64
      - build-aarch64
      - build-macos
      - build-windows-self-hosted
      - build-windows-github-hosted
    if: |
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      (
        (needs.prepare.outputs.targets == 'windows-only' &&
          (needs.build-windows-self-hosted.result == 'success' ||
           needs.build-windows-github-hosted.result == 'success')) ||
        (needs.prepare.outputs.targets == 'aarch64-only' &&
          needs.build-aarch64.result == 'success') ||
        (needs.prepare.outputs.targets == 'macos-only' &&
          needs.build-macos.result == 'success') ||
        (needs.prepare.outputs.targets == 'full' &&
          needs.build-linux-x86_64.result == 'success' &&
          needs.build-aarch64.result == 'success' &&
          needs.build-macos.result == 'success' &&
          (needs.build-windows-self-hosted.result == 'success' ||
           needs.build-windows-github-hosted.result == 'success'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GH_REPO" >/dev/null || {
            echo "Release ${TAG} not found on ${GH_REPO}." >&2
            exit 1
          }
          mapfile -t files < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \))
          [[ ${#files[@]} -gt 0 ]] || { echo "No release archives built." >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "Uploading $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber -R "$GH_REPO"
          done
