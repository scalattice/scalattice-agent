name: Promote to production

# Private repo only. Squash-pushes this tree to public scalattice-agent@production,
# which then runs the Release workflow.
on:
  pull_request:
    types: [closed]
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    if: |
      github.repository == 'scalattice/scalattice-agent-dev' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.merged == true &&
          github.event.pull_request.head.ref == 'development')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Squash-push to public production
        env:
          PROMOTE_SSH_KEY: ${{ secrets.PROMOTE_SSH_KEY }}
          PUBLIC_REPO: scalattice/scalattice-agent
          PUBLIC_BRANCH: production
          PROMOTE_MESSAGE: Promote development ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PROMOTE_SSH_KEY:-}" ]; then
            echo "Missing PROMOTE_SSH_KEY on scalattice-agent-dev." >&2
            echo "Re-run scripts/setup-branch-remotes.sh or add a write deploy key." >&2
            exit 1
          fi
          chmod +x scripts/promote-to-production.sh
          ./scripts/promote-to-production.sh
