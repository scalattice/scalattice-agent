name: CI

# Compile gate on PRs — catches Rust errors before production merge / release tagging.
# Intentionally NOT on the release workflow: cargo check still builds llama.cpp (~15–30m
# cold) and duplicates the platform build jobs.
on:
  pull_request:
    branches: [production, development]
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Match release x86_64 glibc floor (2.35 / Ubuntu 22.04).
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Version numbers are owned by origin tags / release CI (ci-prepare-release.sh).
      # development Cargo.toml routinely lags the tip; do not fail the compile gate on that.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          set -euo pipefail
          chmod +x scripts/ci-apt-linux-build-deps.sh
          ./scripts/ci-apt-linux-build-deps.sh --minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check-gate-jammy
          cache-targets: true
          cache-workspace-crates: true
      - name: cargo check
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo check --no-default-features
